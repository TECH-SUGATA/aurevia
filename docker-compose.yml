# Runs Aurevia with automatic HTTPS (Caddy gets the certificate for you).
# Needs: a server with Docker, and a domain name pointing at it.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - aurevia-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  aurevia-data:
  caddy-data:
